name: Godot verify

on:
  push:
    branches: [main, 'godot/**']
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot.yml'

permissions:
  contents: read

env:
  GODOT_TAG: 4.7-stable
  GODOT_VERSION_DIR: 4.7.stable
  GODOT_BIN: /opt/godot/godot

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_TAG }}-linux

      - name: Install Godot ${{ env.GODOT_TAG }} (headless-capable editor binary)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /opt/godot
          curl -sL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot_extract
          mv "/tmp/godot_extract/Godot_v${GODOT_TAG}_linux.x86_64" "${GODOT_BIN}"
          chmod +x "${GODOT_BIN}"

      - name: Install export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share/godot/export_templates
          curl -sL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates_extract
          mv /tmp/templates_extract/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION_DIR}"

      - name: Sanity-check Godot install
        run: "${GODOT_BIN} --headless --version"

      - name: godot/tools/verify.sh (import -> test -> export)
        run: godot/tools/verify.sh

      - uses: actions/upload-artifact@v4
        with:
          name: godot-web-build
          path: godot/build/web
          if-no-files-found: error
